name: Apply Neon Production Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'scripts/migrate.js'

jobs:
  apply-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply Migrations to Production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Run Production Database Health Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:test
